apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-engine
  namespace: defense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rule-engine
  template:
    metadata:
      labels:
        app: rule-engine
    spec:
      containers:
        - name: rule-engine
          image: rule-engine:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8011
---
apiVersion: v1
kind: Service
metadata:
  name: rule-engine
  namespace: defense
spec:
  selector:
    app: rule-engine
  ports:
    - port: 8011
      targetPort: 8011
---
