apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-app-ingress
  namespace: defense
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ops
            pathType: Prefix
            backend:
              service:
                name: ops-app
                port:
                  number: 8090
