apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-app
  namespace: defense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-app
  template:
    metadata:
      labels:
        app: ops-app
    spec:
      containers:
        - name: ops-app
          image: ops-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: quarantine-storage
              mountPath: /app/runtime
      volumes:
        - name: quarantine-storage
          persistentVolumeClaim:
            claimName: quarantine-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ops-app
  namespace: defense
spec:
  selector:
    app: ops-app
  ports:
    - port: 8090
      targetPort: 8090
