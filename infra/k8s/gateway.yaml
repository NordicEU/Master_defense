apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: defense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: defense-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: defense
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8000
      targetPort: 8000
