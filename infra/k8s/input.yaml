apiVersion: apps/v1
kind: Deployment
metadata:
  name: input-app
  namespace: defense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: input-app
  template:
    metadata:
      labels:
        app: input-app
    spec:
      containers:
        - name: input-app
          image: input-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: defense-config
---
apiVersion: v1
kind: Service
metadata:
  name: input-app
  namespace: defense
spec:
  selector:
    app: input-app
  ports:
    - port: 8080
      targetPort: 8080
