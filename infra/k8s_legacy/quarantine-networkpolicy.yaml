apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarantine-network-policy
  labels:
    app: quarantine-service
    component: containment
    tier: security
spec:
  podSelector:
    matchLabels:
      app: quarantine-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: quarantine-system
          podSelector:
            matchLabels:
              app: gateway-service
      ports:
        - protocol: TCP
          port: 8003
    - from:
        - namespaceSelector:
            matchLabels:
              name: quarantine-system
          podSelector:
            matchLabels:
              app: ops-dashboard
      ports:
        - protocol: TCP
          port: 8003
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Prometheus scraping / observability if present
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090

    # OpenTelemetry collector if present
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
