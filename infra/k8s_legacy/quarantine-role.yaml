apiVersion: v1
kind: ServiceAccount
metadata:
  name: quarantine-service-account
  namespace: quarantine-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quarantine-service-role
  namespace: quarantine-system
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quarantine-service-rolebinding
  namespace: quarantine-system
subjects:
  - kind: ServiceAccount
    name: quarantine-service-account
    namespace: quarantine-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quarantine-service-role
